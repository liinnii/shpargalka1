<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шпаргалка по русскому языку</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Literata:wght@500;600&display=swap">
<style>
:root{--bg:#fff;--soft:#f5f8fc;--line:#e3eaf3;--ink:#1f2a37;--mute:#6b7a8d;--acc:#3b7dd8;--accbg:#e8f1fd;--mark:#fff3b0;--ok:#2f8f6b;--bad:#c9484a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#fff;--soft:#f5f8fc;--line:#e3eaf3;--ink:#1f2a37}}
:root[data-theme="dark"]{--bg:#fff;--soft:#f5f8fc}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Golos Text",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:28px 18px 60px}
h1{font:600 30px/1.2 Literata,Georgia,"Times New Roman",serif;margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 20px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 0 12px;z-index:5;border-bottom:1px solid var(--line)}
.sbox{display:flex;align-items:center;gap:10px;background:var(--soft);border:1.5px solid var(--line);border-radius:14px;padding:0 14px}
.sbox:focus-within{border-color:var(--acc);background:#fff;box-shadow:0 0 0 4px var(--accbg)}
.sbox svg{flex:none;color:var(--mute)}
#q{flex:1;border:0;background:transparent;font:inherit;font-size:17px;padding:14px 0;outline:none;color:var(--ink);min-width:0}
#clr{border:0;background:none;color:var(--mute);font-size:22px;cursor:pointer;display:none;padding:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip:hover{background:var(--soft)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip:focus-visible,#clr:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.meta{color:var(--mute);font-size:14px;margin:14px 0 6px}
.hints{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 4px}
.hint{border:0;background:var(--accbg);color:var(--acc);border-radius:8px;padding:3px 10px;font:inherit;font-size:13px;cursor:pointer}
.card{border:1px solid var(--line);border-radius:12px;margin:12px 0;background:#fff;overflow:hidden}
.card>button{all:unset;box-sizing:border-box;display:flex;width:100%;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.card>button:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.card h2{font:600 17px/1.35 "Golos Text",system-ui,sans-serif;margin:0;flex:1}
.tag{font-size:12.5px;color:var(--acc);background:var(--accbg);border-radius:6px;padding:2px 8px;white-space:nowrap}
.chev{color:var(--mute);transition:transform .2s}
.card.open .chev{transform:rotate(180deg)}
.body{display:none;padding:2px 16px 16px;border-top:1px solid var(--line);background:linear-gradient(#fff,var(--soft))}
.card.open .body{display:block}
.body p{margin:12px 0 6px}
.body ul{margin:6px 0;padding-left:20px}
.body li{margin:3px 0}
.ex{background:#fff;border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:15px}
.ok{color:var(--ok);font-weight:500}.no{color:var(--bad);font-weight:500}
table{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0;background:#fff}
td,th{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:600}
.tw{overflow-x:auto}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--mute);padding:40px 10px;border:1px dashed var(--line);border-radius:12px}
.tools{display:flex;gap:8px;margin-top:6px}
.tools button{border:0;background:none;color:var(--acc);font:inherit;font-size:14px;cursor:pointer;padding:2px 0}
</style>
</head>
<body>
<div class="wrap">
<h1>Шпаргалка по русскому языку</h1>
<p class="sub">Введите тему, правило, слово или знак: «запятая», «не с глаголами», «паронимы», «ударение».</p>
<div class="bar">
 <label class="sbox"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
 <input id="q" type="search" placeholder="Поиск по правилам, словам, синонимам…" autocomplete="off" aria-label="Поиск"><button id="clr" aria-label="Очистить">×</button></label>
 <div class="chips" id="chips"></div>
</div>
<div class="meta"><span id="cnt"></span>
 <div class="tools"><button id="openAll">Раскрыть все</button><button id="closeAll">Свернуть все</button></div></div>
<div class="hints" id="hints"></div>
<div id="list"></div>
</div>
<script>
const T=(h,rows)=>'<div class="tw"><table><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</table></div>';
const D=[
// ЗАПЯТЫЕ
["Запятые","Однородные члены предложения","<p>Запятая ставится между однородными членами <b>без союзов</b>, с союзами <b>а, но, да (=но), зато, однако</b> и при повторяющихся <b>и…и, ни…ни, или…или, то…то</b>.</p><div class='ex'>Он купил хлеб, молоко, сыр. · Не он, а она. · И дождь, и ветер.</div><p>Не ставится: между словами, соединёнными одиночными <b>и, или, да (=и)</b>, и в устойчивых парах (<i>ни свет ни заря</i>).</p>","однородные перечисление и или а но союз"],
["Запятые","Обобщающее слово при однородных","<p>Перед перечислением — двоеточие, после — тире.</p><div class='ex'>Всюду: на столе, на полу, на окнах — лежали книги.<br>Лежали книги, тетради, ручки — всё нужное для учёбы.</div>","обобщающее слово двоеточие тире"],
["Запятые","Обособленные определения","<p>Причастный оборот <b>после</b> определяемого слова выделяется запятыми; <b>перед</b> ним — нет (если нет оттенка причины).</p><div class='ex'>Книга, <i>лежавшая на столе</i>, упала.<br>Лежавшая на столе книга упала.</div>","причастный оборот обособление определение"],
["Запятые","Деепричастный оборот","<p>Всегда выделяется запятыми. Одиночное деепричастие — тоже, если не слилось с глаголом по смыслу.</p><div class='ex'>Он вошёл, <i>улыбаясь</i>. · Он шёл <i>не оглядываясь</i> (слитно по смыслу — без запятой).</div><p>Не обособляются: <b>фразеологизмы</b> (<i>сломя голову, спустя рукава, засучив рукава</i>).</p>","деепричастный оборот деепричастие обособление"],
["Запятые","Вводные слова","<p>Выделяются запятыми: <b>конечно, например, к сожалению, во-первых, по-моему, кажется, наверное, итак, словом, впрочем, видимо</b>.</p><p>Не вводные: <b>вдруг, вроде, как будто, будто, словно, почти, даже, именно, только, пожалуй</b> (чаще), <b>авось, якобы</b>.</p><div class='ex'>Он, <i>конечно</i>, придёт. · Он <i>вдруг</i> замолчал.</div>","вводные слова конечно наверное например"],
["Запятые","Обращение","<p>Обращение выделяется запятыми; при интонации восклицания после него — «!».</p><div class='ex'>Мама, я пришёл! · Друзья мои, прекрасен наш союз.</div>","обращение"],
["Запятые","Сложносочинённое предложение","<p>Запятая перед <b>и, да, а, но, или</b> между самостоятельными частями с разными подлежащими.</p><p>Не ставится, если есть <b>общий второстепенный член</b>, общее придаточное или обе части — вопросительные/назывные/безличные.</p><div class='ex'>Выглянуло солнце, и снег заблестел.<br>Утром светило солнце и пели птицы (общее обстоятельство «утром» — запятая не нужна).</div>","сложносочинённое ссп части и да"],
["Запятые","Сложноподчинённое: запятая перед союзами","<p>Придаточное всегда отделяется запятой: <b>что, чтобы, если, когда, потому что, так как, хотя, пока, который, где, куда, как</b>.</p><p>Составные союзы: запятая перед всем союзом — <i>благодаря тому, что; ввиду того, что; в то время как; для того чтобы</i> (запятая внутри только при акценте: <i>не для того, чтобы…</i>).</p><div class='ex'>Я знаю, что ты придёшь. · Он ушёл, потому что устал.</div>","сложноподчинённое спп союзы что чтобы если который придаточное"],
["Запятые","Сравнительный оборот (как, словно, точно)","<p>Выделяется запятыми. Не выделяется: после <b>как</b> (= в качестве), в составе сказуемого, фразеологизмах, при отрицании «не» перед ним.</p><div class='ex'>Глаза, <i>как звёзды</i>, сияли. · Он работает <i>как учитель</i> (= в качестве). · Лицо белое как снег (фразеолог.).</div>","как сравнительный оборот словно точно будто"],
["Запятые","Союз «чтобы» и «что бы»","<p><b>Чтобы</b> — союз (цель): <i>Я пришёл, чтобы помочь.</i></p><p><b>Что бы</b> — местоимение + частица (можно вставить «то»): <i>Что бы ты ни сказал.</i></p>","чтобы что бы слитно раздельно"],
// ПУНКТУАЦИЯ
["Пунктуация","Тире между подлежащим и сказуемым","<p>Тире ставится, если оба главных члена — <b>существительные в И.п.</b> или <b>числительные</b>, или один из них — инфинитив, а связки нет.</p><div class='ex'>Москва — столица России. · Жить — Родине служить.</div><p>Не ставится: если есть частица <b>не</b>; сказуемое — прилагательное; подлежащее — местоимение (<i>Он учитель</i>); есть союз <b>как, будто, словно</b>.</p>","тире подлежащее сказуемое"],
["Пунктуация","Двоеточие в бессоюзном предложении","<p>Ставится, если вторая часть <b>объясняет, причину, дополняет</b> первую (можно вставить «потому что», «а именно», «что»).</p><div class='ex'>Я не пошёл: было поздно.</div><p>Тире — если вторая часть <b>противопоставление, следствие, время/условие</b> (можно «и», «но», «если»).</p><div class='ex'>Дождь пошёл — мы вернулись.</div>","двоеточие тире бессоюзное предложение"],
["Пунктуация","Прямая речь и диалог","<table><tr><th>Схема</th><th>Пример</th></tr><tr><td>«П», — а.</td><td>«Иду», — сказал он.</td></tr><tr><td>А: «П».</td><td>Он сказал: «Иду».</td></tr><tr><td>«П?» — а.</td><td>«Идёшь?» — спросил он.</td></tr></table><p>В диалоге каждая реплика с новой строки и тире.</p>","прямая речь диалог кавычки"],
["Пунктуация","Кавычки, скобки, многоточие","<ul><li>Кавычки: названия, цитаты, переносное значение слов.</li><li>Многоточие — три точки; после «?» и «!» — «?..», «!..».</li><li>Скобки — пояснение; точка ставится <b>после</b> скобки, если предложение внутри не отдельное.</li></ul>","кавычки скобки многоточие"],
// ОРФОГРАФИЯ
["Орфография","Проверяемые безударные гласные в корне","<p>Подберите проверочное слово, чтобы гласная стала ударной.</p><div class='ex'>в<b>о</b>да — в<b>о</b>ды · гр<b>и</b>бы — гр<b>и</b>б · пл<b>а</b>вать — пл<b>а</b>вают</div>","безударные гласные проверочное слово корень"],
["Орфография","Чередующиеся гласные в корне","<div class='tw'><table><tr><th>Корень</th><th>Правило</th><th>Пример</th></tr><tr><td>-кос-/-каc-</td><td>-а-, если суффикс -а-</td><td>касаться, коснуться</td></tr><tr><td>-лаг-/-лож-</td><td>-а- перед г; -о- перед ж</td><td>предлагать, предложить</td></tr><tr><td>-рас-/-раст-/-рос-</td><td>-раст-, -ращ- → а; -рос- → о; исключения: росток, Ростов, отрасль, ростовщик</td><td>растение, вырос</td></tr><tr><td>-бир-/-бер-</td><td>-и- перед суффиксом -а-</td><td>собирать, соберу</td></tr><tr><td>-мир-/-мер-, -пир-/-пер-, -тир-/-тер-</td><td>-и- перед суффиксом -а-</td><td>замирать — замереть</td></tr></table></div>","чередование гласных корень лаг лож кас кос раст рос бир бер зар зор"],
["Орфография","Непроверяемые гласные и словарные слова","<p>Запоминаются: <i>вокзал, газета, километр, магазин, пейзаж, ветеран, профессия, коллега, аллея, апельсин, винегрет, горизонт, диалог, дисциплина, лаборатория, портфель, расстояние, трамвай</i>.</p>","словарные слова непроверяемые"],
["Орфография","Правописание Ы–И после приставок","<p>После приставок на согласную (кроме <b>меж-</b> и <b>сверх-</b>) корень на И переходит в Ы.</p><div class='ex'>игра → <b>раз</b>ыграть; <b>без</b>ыдейный; но <b>меж</b>институтский, <b>сверх</b>интересный, <b>пред</b>историческое.</div>","ы и после приставок игра"],
["Орфография","Гласные после шипящих и Ц","<ul><li><b>ЖИ, ШИ</b> — пиши с И; <b>ЧА, ЩА</b> — с А; <b>ЧУ, ЩУ</b> — с У.</li><li>После Ц: <b>И</b> в корне (цирк, цифра), <b>Ы</b> в окончаниях и суффиксах (птицы, огурцы).</li><li>Исключения: <i>цыган, цыплёнок, цыц, на цыпочках</i>.</li><li><b>О/Ё</b> после шипящих — под ударением: <i>жёлтый, чёрный, шёпот</i>; без ударения — Е (<i>чем</i>) или О (<i>чопорный</i>).</li></ul>","шипящие ча ща чу щу жи ши ц ё о"],
["Орфография","Ь знак после шипящих","<p><b>Ь пишется</b>: у существительных 3-го склонения (<i>рожь, мышь, ночь</i>); у глаголов в форме 2 л. ед. ч. (<i>пишешь, учишься</i>), в инфинитиве (<i>беречь</i>), в наречиях (<i>вскачь, настежь, невмочь</i>), частицах (<i>вишь, лишь</i>).</p><p><b>Не пишется</b>: у существительных м. р. (<i>нож, плащ, ключ</i>), в кратких прилагательных м. р. (<i>свеж, горяч</i>), в наречиях <i>уж, замуж, невтерпёж</i>, частице <i>тож</i>.</p>","мягкий знак шипящие ь"],
["Орфография","Разделительные Ь и Ъ","<p><b>Ъ</b> — после приставок на согласную перед е, ё, ю, я: <i>подъезд, объявление, съёмка, въезд</i>. Также в сложных словах с иноязычными приставками: <i>адъютант, контръявление</i>.</p><p><b>Ь</b> — внутри слова перед е, ё, ю, я, и: <i>семья, платье, вьюга, вороньё</i>.</p>","ъ ь разделительный твёрдый знак мягкий"],
["Орфография","НЕ с глаголами и деепричастиями","<p>Раздельно: <i>не знать, не любит</i>. Слитно, если слово без «не» не употребляется: <i>ненавидеть, негодовать, недомогать, невзлюбить</i>.</p><p>Приставка <b>недо-</b> всегда слитно: <i>недосмотреть</i>.</p><div class='ex'><span class='ok'>не</span> знать · <span class='ok'>ненавидеть</span></div>","не с глаголами слитно раздельно"],
["Орфография","НЕ с существительными, прилагательными, наречиями","<p><b>Слитно</b>: слово без не не употребляется (<i>неряха, ненастье, неправда</i>); можно заменить синонимом (<i>невежа — грубиян, невысокий — низкий</i>).</p><p><b>Раздельно</b>: есть противопоставление (<i>не добро, а зло</i>), слова: <i>вовсе, отнюдь, далеко, ничуть, совсем, нисколько, нисколько не</i> (<i>вовсе не интересный</i>), местоимения (<i>не он</i>).</p>","не с существительными прилагательными наречиями слитно раздельно"],
["Орфография","НЕ с причастиями","<p><b>Слитно</b>: нет зависимых слов и противопоставления (<i>неоконченная работа, нерешённая задача</i>).</p><p><b>Раздельно</b>: есть зависимое слово, противопоставление <b>а</b>, слова <b>вовсе, отнюдь, далеко, ничуть</b> (<i>не решённая мной задача, не законченная, а брошенная</i>). У кратких причастий — раздельно: <i>работа не закончена</i>.</p>","не с причастиями"],
["Орфография","НЕ и НИ (в частицах, местоимениях, наречиях)","<ul><li><b>НЕ</b> — отрицание: <i>Не знаю.</i></li><li><b>НИ</b> — усиление: <i>ни одного, ни разу, ни при чём</i>.</li><li>Отрицательные местоимения: <b>с НЕ</b> под ударением (<i>не́кого</i>) и <b>с НИ</b> без ударения (<i>ни́кого</i>).</li><li>Если есть предлог — раздельно: <i>не у кого, ни с кем</i>.</li></ul>","ни не частицы отрицательные местоимения"],
["Орфография","Н и НН в прилагательных и причастиях","<table><tr><th>Часть</th><th>Н / НН</th><th>Пример</th></tr><tr><td>прилагательное на -ин/-ан/-ян</td><td>одна Н исключения: стеклянный, оловянный, деревянный</td><td>кожаный</td></tr><tr><td>Прилагательное от сущ. на -н</td><td>НН</td><td>каменный, длинный</td></tr><tr><td>полное причастие с зависимым словом</td><td>НН (от глаголов сов. вида)</td><td>прочитанная книга</td></tr><tr><td>прилагательное от глагола несов. вида</td><td>Н</td><td>жареный картофель</td></tr><tr><td>краткие причастия</td><td>Н</td><td>книга прочитана</td></tr></table>","н нн прилагательные причастия"],
["Орфография","-ТСЯ и -ТЬСЯ в глаголах","<p><b>-ться</b> — инфинитив (что делать? что сделать?): <i>учиться, смеяться</i>.</p><p><b>-тся</b> — 3 лицо (что делает? что сделает?): <i>учится, смеётся</i>.</p>","тся ться глаголы окончание"],

const cats=["Все",...new Set(D.map(d=>d[0]))];
let cat="Все",q="";
const norm=s=>s.toLowerCase().replace(/ё/g,"е");
const strip=h=>h.replace(/<[^>]*>/g," ");
const idx=D.map(d=>norm(d[1]+" "+strip(d[2])+" "+d[3]+" "+d[0]));
const $=id=>document.getElementById(id);
function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}
function hl(html,words){
  if(!words.length)return html;
  const re=new RegExp("("+words.map(w=>esc(w).replace(/е/g,"[её]")).join("|")+")","gi");
  return html.split(/(<[^>]*>)/).map(p=>p[0]==="<"?p:p.replace(re,"<mark>$1</mark>")).join("");
}
function render(){
  const words=norm(q).split(/\s+/).filter(Boolean);
  const out=[];
  D.forEach((d,i)=>{
    if(cat!=="Все"&&d[0]!==cat)return;
    if(words.every(w=>idx[i].includes(w)))out.push(i);
  });
  $("cnt").textContent=out.length?("Найдено: "+out.length):"";
  $("list").innerHTML=out.length?out.map(i=>{
    const d=D[i],open=words.length&&out.length<=8;
    return `<article class="card${open?" open":""}"><button aria-expanded="${!!open}"><h2>${hl(d[1],words)}</h2><span class="tag">${d[0]}</span><svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button><div class="body">${hl(d[2],words)}</div></article>`;
  }).join(""):`<div class="empty">Ничего не найдено по запросу «${q.replace(/</g,"&lt;")}».<br>Попробуйте корень слова или другую тему: «запятая», «не», «ударение».</div>`;
  $("clr").style.display=q?"block":"none";
}
$("chips").innerHTML=cats.map(c=>`<button class="chip${c==="Все"?" on":""}">${c}</button>`).join("");
$("chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;cat=b.textContent;[...$("chips").children].forEach(x=>x.classList.toggle("on",x===b));render()};
$("hints").innerHTML=["запятая","не с глаголами","синонимы","паронимы","ударение","фразеологизмы","тире"].map(h=>`<button class="hint">${h}</button>`).join("");
$("hints").onclick=e=>{const b=e.target.closest(".hint");if(!b)return;q=b.textContent;$("q").value=q;render()};
$("q").oninput=e=>{q=e.target.value;render()};
$("clr").onclick=()=>{q="";$("q").value="";render();$("q").focus()};
$("list").onclick=e=>{const b=e.target.closest(".card>button");if(!b)return;const c=b.parentElement;c.classList.toggle("open");b.setAttribute("aria-expanded",c.classList.contains("open"))};
$("openAll").onclick=()=>document.querySelectorAll(".card").forEach(c=>c.classList.add("open"));
$("closeAll").onclick=()=>document.querySelectorAll(".card").forEach(c=>c.classList.remove("open"));
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement!==$("q")){e.preventDefault();$("q").focus()}});
render();
</script>
</body>
</html>
